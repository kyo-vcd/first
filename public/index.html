<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1만 원의 경로 — 전장의 병원은 안전한가</title>
  <meta name="description" content="후원금 1만 원이 전장의 병원에 닿기까지, 그리고 그 병원이 공격받을 때 일어나는 일을 스크롤로 따라가는 인터랙티브 스토리.">
  <meta name="theme-color" content="#121212">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">

  <!-- 공통 스타일 -->
  <link rel="stylesheet" href="css/style.css">
  <!-- 장면별 스타일: 장면을 추가하면 여기에 한 줄 추가 -->
  <link rel="stylesheet" href="css/scenes/s01.css">
</head>
<body>

  <!-- 공통 헤더: 현재 장면과 장면 진행 표시 -->
  <header class="story-header" aria-label="장면 진행">
    <p class="story-scene-label">SCENE <span class="story-scene-no">01</span> / 08 — <span class="story-scene-title">1만 원의 경로</span></p>
    <ol class="story-steps" aria-hidden="true">
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
      <li class="story-step"></li>
    </ol>
  </header>

  <main class="story">

    <!-- =========================================================
         SCENE 01 — 1만 원의 경로 (후원금 흐름)
         부모: .scene-01 (스크롤 구간)  >  .sticky-screen (고정 화면)
         자식: .s01-headlines / .s01-control / .s01-stage / .s01-next
         ========================================================= -->
    <section class="scene scene-01" id="scene-01" data-scene="s01" data-no="01" data-title="1만 원의 경로" aria-labelledby="s01-heading">
      <div class="sticky-screen">

        <div class="s01-headlines">
          <h2 class="s01-title s01-title--ask" id="s01-heading">당신의 후원금은<br>현장에서 어떻게 쓰일까요?</h2>
          <p class="s01-title s01-title--split">후원금의 <em>86%</em>는 중간 누수 없이<br>현장으로 직행합니다</p>
          <p class="s01-title s01-title--result"><span class="s01-total">10,000원</span> 중 <strong class="s01-field-amount">8,600원</strong>이<br>현장 의료 활동에 사용됩니다</p>
        </div>

        <form class="s01-control">
          <label class="s01-control-label" for="s01-amount">후원 금액</label>
          <input class="s01-amount" id="s01-amount" type="range" min="10000" max="100000" step="10000" value="10000">
          <output class="s01-amount-value" for="s01-amount">10,000원</output>
          <button class="s01-donate" type="submit">후원하기</button>
        </form>

        <div class="s01-stage">
          <div class="s01-tank s01-tank--field" data-rate="0.86">
            <div class="s01-tank-body">
              <span class="s01-tank-rate">86%</span>
              <div class="s01-tank-box"></div>
              <canvas class="s01-coins" aria-hidden="true"></canvas>
              <span class="s01-tank-badge">8,600원</span>
            </div>
            <p class="s01-tank-label">현장 의료 물자</p>
          </div>
          <div class="s01-tank s01-tank--fund" data-rate="0.10">
            <div class="s01-tank-body">
              <span class="s01-tank-rate">10%</span>
              <div class="s01-tank-box"></div>
              <canvas class="s01-coins" aria-hidden="true"></canvas>
            </div>
            <p class="s01-tank-label">모금</p>
          </div>
          <div class="s01-tank s01-tank--ops" data-rate="0.04">
            <div class="s01-tank-body">
              <span class="s01-tank-rate">4%</span>
              <div class="s01-tank-box"></div>
              <canvas class="s01-coins" aria-hidden="true"></canvas>
            </div>
            <p class="s01-tank-label">운영비</p>
          </div>
        </div>

        <p class="s01-next">그렇다면 현장으로 전달된 <em class="s01-field-amount">8,600원</em>은<br>실제로 어떤 물품이 되어 환자들에게 닿을까요?</p>

        <p class="scroll-hint s01-hint" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v11M3 8l5 5 5-5"/></svg>
          스크롤해서 계속
        </p>

        <p class="visually-hidden s01-live" aria-live="polite"></p>
      </div>
    </section>

    <!-- 다음 장면 자리: SCENE 02부터 이 아래에 같은 구조로 추가 -->

  </main>

  <footer class="story-footer">
    <p class="story-footer-next">SCENE 02 — 화폐에서 생명으로</p>
    <p class="story-footer-note">다음 장면을 준비하고 있습니다.</p>
  </footer>

  <!-- 공통 스크립트: 스크롤 진행률 계산과 장면 관리 -->
  <script src="js/script.js"></script>
  <!-- 장면별 스크립트: 장면을 추가하면 여기에 한 줄 추가 -->
  <script src="js/scenes/s01.js"></script>
</body>
</html>
